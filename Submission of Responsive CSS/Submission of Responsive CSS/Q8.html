<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="Filter Comparison Layout.css">
</head>
<body>
    <header>
        <h1>Image Filter Comparison</h1>
        <p>Compare the original image with the filtered image.</p>
    </header>

    <main>
        <section class="comparison">
            <figure class="image-card">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Original mountain landscape">
                <figcaption>Before: Original Image</figcaption>
            </figure>

            <figure class="image-card">
                <img class="filtered-image" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Brightness filtered mountain landscape">
                <figcaption>After: Brightness Filter</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>Image Filter Comparison | CSS Practical</p>
    </footer>
</body>
</html>
