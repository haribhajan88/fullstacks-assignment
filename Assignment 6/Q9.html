
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card">

            <div class="front">
                <img src="https://placehold.co/300x200?text=Web+Development"
                     alt="Web development">
                <h2>Web Development</h2>
            </div>

            <div class="back">
                <h2>About</h2>
                <p>Web development involves creating websites
                using HTML, CSS, and programming technologies.</p>
            </div>

        </div>
    </div>

</body>
</html>
