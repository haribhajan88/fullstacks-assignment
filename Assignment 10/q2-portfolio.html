<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="q2-portfolio.css">
</head>

<body class="bg-light text-dark">

    <main class="container text-center p-5">

        <header class="mb-3">
            <h1 class="fw-bold">Hrithik roshan</h1>
            <p class="lead">
                Designer crafting warm, useful digital products.
            </p>
        </header>

        <img
            class="img-fluid rounded-circle profile mb-3"
            src="https://tse1.explicit.bing.net/th/id/OIP.s8fnGyyNuVCkXZm3mkPJ1QHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
            alt="Ananya Sharma"
        >

        <p class="mt-4">
            I turn complex ideas into friendly customer experiences.
        </p>

        <a class="btn btn-dark me-2" href="#contact">
            Hire Me
        </a>

        <a class="btn btn-outline-dark" href="#">
            Download CV
        </a>

        <section
            id="contact"
            class="card mx-auto mt-4 p-4 text-start contact"
        >
            <h2 class="h4 text-center">
                Let’s connect
            </h2>

            <form>
                <input
                    class="form-control mb-3"
                    type="email"
                    placeholder="Your email"
                >

                <textarea
                    class="form-control mb-3"
                    placeholder="Tell me about your project"
                ></textarea>

                <button class="btn btn-primary w-100">
                    Send Message
                </button>
            </form>
        </section>

    </main>

</body>
</html>
