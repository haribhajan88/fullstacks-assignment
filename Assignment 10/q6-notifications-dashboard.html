<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
 
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
 
    <link rel="stylesheet" href="q6-notifications-dashboard.css">
</head>
 
<body class="bg-body-tertiary">
 
    <main class="container py-5">
 
        <div class="card shadow-sm">
 
            <div class="card-body p-4 p-md-5">
 
                <h1 class="h2">Notifications</h1>
 
                <section class="well my-4">
                    <strong>Today’s summary</strong>
 
                    <p class="mb-0">
                        You have 3 updates that need your attention.
                    </p>
                </section>
 
                <div class="alert alert-success">
                    New message: Priya shared the campaign brief.
                </div>
 
                <div class="alert alert-info">
                    Tip: Set your availability before tomorrow’s meeting.
                </div>
 
                <div class="alert alert-danger">
                    Warning: Your trial ends in 3 days.
                </div>
 
                <div
                    class="alert alert-warning alert-dismissible fade show"
                    role="alert">
 
                    Your profile is 80% complete.
 
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                    </button>
 
                </div>
 
            </div>
 
        </div>
 
    </main>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 
</body>
 
</html>
