<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderwell Travel</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="q10-travel-showcase.css">
</head>

<body>

    <header class="container py-3 d-flex justify-content-between align-items-center">

        <a class="navbar-brand fw-bold text-primary" href="#">
            Wanderwell
        </a>

        <span>
            Curated escapes, thoughtfully planned.
        </span>

    </header>

    <main>

        <section
            id="destinations"
            class="carousel slide"
            data-bs-ride="carousel">

            <div class="carousel-inner">

                <div
                    class="carousel-item active"
                    data-bs-interval="3500">

                    <img
                        src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=85"
                        class="d-block w-100"
                        alt="Maldives beach">

                    <div class="carousel-caption">
                        <h1>Maldives</h1>
                        <p>Wake up above crystal-clear water.</p>
                    </div>

                </div>

                <div
                    class="carousel-item"
                    data-bs-interval="4500">

                    <img
                        src="https://images.unsplash.com/photo-1494526585095-c41746248156?auto=format&fit=crop&w=1600&q=85"
                        class="d-block w-100"
                        alt="Santorini coast">

                    <div class="carousel-caption">
                        <h1>Santorini</h1>
                        <p>Sunset walks over the Aegean.</p>
                    </div>

                </div>

                <div
                    class="carousel-item"
                    data-bs-interval="4000">

                    <img
                        src="https://images.unsplash.com/photo-1528181304800-259b08848526?auto=format&fit=crop&w=1600&q=85"
                        class="d-block w-100"
                        alt="Bali temple">

                    <div class="carousel-caption">
                        <h1>Bali</h1>
                        <p>Find your rhythm in the tropics.</p>
                    </div>

                </div>

            </div>

            <button
                class="carousel-control-prev"
                type="button"
                data-bs-target="#destinations"
                data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

            </button>

            <button
                class="carousel-control-next"
                type="button"
                data-bs-target="#destinations"
                data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

            </button>

        </section>

        <section class="container py-5">

            <h2 class="h4">
                Your next escape is 70% planned
            </h2>

            <div
                class="progress"
                role="progressbar"
                aria-label="Booking completion"
                aria-valuenow="70"
                aria-valuemin="0"
                aria-valuemax="100">

                <div
                    class="progress-bar progress-bar-striped progress-bar-animated bg-success"
                    style="width: 70%;">

                    70%

                </div>

            </div>

        </section>

    </main>

    <footer class="bg-dark text-white text-center py-4">
        Wanderwell Travel · hello@wanderwell.example · +91 98765 43210
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
