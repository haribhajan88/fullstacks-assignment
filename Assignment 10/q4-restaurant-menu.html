<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saffron Table</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="q4-restaurant-menu.css">
</head>

<body>

    <header class="text-center py-5 bg-warning-subtle">
        <h1>Saffron Table</h1>
        <p class="lead">
            Today’s Menu — local ingredients, slow-cooked flavors.
        </p>
    </header>

    <main class="container py-5">

        <div class="row g-5">

            <section class="col-lg-8">

                <h2 class="h3">From our kitchen</h2>

                <table class="table table-hover">

                    <thead>
                        <tr>
                            <th>Dish</th>
                            <th>Category</th>
                            <th class="text-end">Price</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>Smoked Tomato Soup</td>
                            <td>Starter</td>
                            <td class="text-end">₹240</td>
                        </tr>

                        <tr>
                            <td>Garden Risotto</td>
                            <td>Main</td>
                            <td class="text-end">₹520</td>
                        </tr>

                        <tr>
                            <td>Cardamom Panna Cotta</td>
                            <td>Dessert</td>
                            <td class="text-end">₹280</td>
                        </tr>
                    </tbody>

                </table>

                <figure>
                    <img
                        class="img-fluid rounded"
                        src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1000&q=80"
                        alt="Restaurant meal">

                    <figcaption class="text-center text-secondary mt-2">
                        Fresh dishes, plated with care.
                    </figcaption>
                </figure>

            </section>

            <aside class="col-lg-4">

                <h2 class="h3">Chef’s Specials</h2>

                <ul class="list-group">
                    <li class="list-group-item">
                        Charred Corn Tacos
                    </li>

                    <li class="list-group-item">
                        Miso Glazed Eggplant
                    </li>

                    <li class="list-group-item">
                        Coconut Lime Tart
                    </li>
                </ul>

            </aside>

        </div>

    </main>

</body>

</html>
