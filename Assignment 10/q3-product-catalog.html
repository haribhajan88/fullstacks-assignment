<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Goods</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="q3-product-catalog.css">
</head>

<body>

    <header class="bg-dark text-white py-4">
        <div class="container">
            <h1 class="h3 mb-0">North Goods</h1>
        </div>
    </header>

    <main class="container py-5">

        <h2 class="mb-4">Everyday essentials</h2>

        <div class="row g-4">

            <article class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm product">
                    <img
                        class="card-img-top"
                        src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80"
                        alt="Running shoe">

                    <div class="card-body">
                        <h3 class="h5">Trail Runner</h3>
                        <p>₹4,999</p>
                        <button class="btn btn-dark">
                            Add to Cart
                        </button>
                    </div>
                </div>
            </article>

            <article class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm product">
                    <img
                        class="card-img-top"
                        src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80"
                        alt="Watch">

                    <div class="card-body">
                        <h3 class="h5">Field Watch</h3>
                        <p>₹7,500</p>
                        <button class="btn btn-dark">
                            Add to Cart
                        </button>
                    </div>
                </div>
            </article>

            <article class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm product">
                    <img
                        class="card-img-top"
                        src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80"
                        alt="Headphones">

                    <div class="card-body">
                        <h3 class="h5">Studio Headphones</h3>
                        <p>₹3,200</p>
                        <button class="btn btn-dark">
                            Add to Cart
                        </button>
                    </div>
                </div>
            </article>

            <article class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm product">
                    <img
                        class="card-img-top"
                        src="https://images.unsplash.com/photo-1491637639811-60e2756cc1c7?auto=format&fit=crop&w=600&q=80"
                        alt="Jacket">

                    <div class="card-body">
                        <h3 class="h5">Canvas Jacket</h3>
                        <p>₹5,600</p>
                        <button class="btn btn-dark">
                            Add to Cart
                        </button>
                    </div>
                </div>
            </article>

        </div>

    </main>

</body>

</html>
