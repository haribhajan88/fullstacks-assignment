<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="q7-task-tracker.css">
</head>

<body>

    <main class="container py-5">

        <header class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h1 class="h2 mb-0">Today’s Tasks</h1>
                <small>Monday, 2 November</small>
            </div>

            <span class="badge text-bg-primary rounded-pill">
                3 Pending
            </span>

        </header>

        <section class="list-group shadow-sm">

            <div class="list-group-item d-flex justify-content-between align-items-center">
                Review homepage copy
                <span class="badge text-bg-danger">
                    High
                </span>
            </div>

            <div class="list-group-item d-flex justify-content-between align-items-center">
                Prepare client notes
                <span class="badge text-bg-warning">
                    Medium
                </span>
            </div>

            <div class="list-group-item d-flex justify-content-between align-items-center">
                Organize design files
                <span class="badge text-bg-success">
                    Low
                </span>
            </div>

        </section>

        <button class="btn btn-success mt-4">
            Completed
            <span class="badge text-bg-light text-dark">
                12
            </span>
        </button>

    </main>

</body>

</html>
