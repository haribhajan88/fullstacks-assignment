<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Image Gallery</title>
    <style>
      body {
        font-family:Arial;
        margin:30px
      }
      .grid {
        display:grid;
        grid-template-columns:repeat(3,1fr);
        gap:10px
      }
      .grid img {
        width:100%;
        height:150px;
        object-fit:cover;
        cursor:pointer
      }
      .modal {
        display:none;
        position:fixed;
        inset:0;
        background:#000a;
        align-items:center;
        justify-content:center
      }
      .modal.show {
        display:flex
      }
      .modal img {
        max-width:80%;
        max-height:80%;
        border:5px solid white
      }
    </style>
  </head>
  <body>
    <h2>Image Gallery</h2>
    <div class="grid" id="gallery">
    </div>
    <div class="modal" id="modal">
      <img id="bigImage" alt="Preview">
    </div>
    <script src="q5-image-gallery.js">
    </script>
  </body>
</html>
