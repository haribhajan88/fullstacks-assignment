<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quotations</title>
</head>
<body>

    <h1>HTML Quotations</h1>

    <!-- Long quotation -->
    <blockquote>
        Learning HTML is an important step in understanding web development.
        HTML uses tags to structure content such as &lt;h1&gt;, paragraphs,
        images, links, and forms.
    </blockquote>

    <!-- Short quotation -->
    <p>
        My teacher always says, <q>Practice makes perfect.</q>
    </p>

</body>
</html>
