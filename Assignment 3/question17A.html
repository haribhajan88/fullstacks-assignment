<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Page</title>
</head>
<body>

    <h1>Simple Form</h1>

    <!-- The target attribute loads the result into the iframe -->
    <form action="q17-result.html" method="get" target="resultFrame">

        <label for="name">Enter Name:</label>
        <input type="text" id="name" name="name">

        <input type="submit" value="Submit">

    </form>

    <br>

    <!-- Result page will be displayed here after submission -->
    <iframe
        name="resultFrame"
        width="500"
        height="200"
        title="Form Result">
    </iframe>

</body>
</html>
