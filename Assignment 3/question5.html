<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Defines UTF-8 character encoding -->
    <meta charset="UTF-8">

    <!-- Defines the author of the webpage -->
    <meta name="author" content="Hari">

    <!-- Makes the page responsive on different devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UTF-8 Encoding</title>
</head>

<body>

    <h1>UTF-8 Encoding Example</h1>

    <p>
        English: Hello, how are you?
        <br>
        Hindi: नमस्ते, आप कैसे हैं?
        <br>
        Japanese: こんにちは、お元気ですか？
    </p>

</body>
</html>
