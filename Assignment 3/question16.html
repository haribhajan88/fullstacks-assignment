<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URI Encoding</title>
</head>
<body>

    <h1>URI Encoding Example</h1>

    <p>Original URL:</p>
    <p>https://example.com/search?query=HTML & CSS</p>

    <p>Encoded URL:</p>

    <!-- Spaces are represented using %20 -->
    <a href="https://example.com/search?query=HTML%20%26%20CSS">
        Search HTML &amp; CSS
    </a>

</body>
</html>
