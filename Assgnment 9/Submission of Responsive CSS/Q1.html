<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="Responsive Image Filter Gallery.css">
</head>
<body>
    <header>
        <h1>Image Filter Gallery</h1>
        <p>Hover over the images to remove their filters.</p>
    </header>

    <main>
        <section class="gallery">
            <figure class="gallery-item">
                <img class="blur" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=600&q=80" alt="Mountain landscape">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="grayscale" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=80" alt="Beautiful nature">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="sepia" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=600&q=80" alt="Forest trees">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="brightness" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=600&q=80" alt="Lake and mountains">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="contrast" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=600&q=80" alt="Snowy mountain">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="hue" src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=600&q=80" alt="Ocean waves">
                <figcaption>Hue-Rotate Filter</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>Responsive Image Gallery | CSS Practical</p>
    </footer>
</body>
</html>
