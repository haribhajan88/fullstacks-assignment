<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="Filter Cards with Animation.css">
</head>
<body>
    <header>
        <h1>Our Team</h1>
        <p>Hover over a profile to see its effect.</p>
    </header>

    <main>
        <section class="profile-container">
            <article class="profile-card">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=500&q=80" alt="Alex profile">
                <h2>Alex Morgan</h2>
                <p>Frontend Developer</p>
            </article>

            <article class="profile-card">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=500&q=80" alt="Sarah profile">
                <h2>Sarah Johnson</h2>
                <p>UI Designer</p>
            </article>

            <article class="profile-card">
                <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=500&q=80" alt="David profile">
                <h2>David Smith</h2>
                <p>Software Engineer</p>
            </article>
        </section>
    </main>

    <footer>
        <p>Meet Our Team | CSS Practical</p>
    </footer>
</body>
</html>
