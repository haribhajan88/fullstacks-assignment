<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
</head>
<body>

    <h1>Online Store Product Catalog</h1>

    <!-- Product table -->
    <table border="1">
        <tr>
            <th colspan="2">Product Information</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>

        <tr>
            <td>
                <img src="laptop.jpg" alt="Laptop" width="100">
            </td>
            <td>Laptop</td>
            <td rowspan="2">₹50,000</td>
            <td>In Stock</td>
        </tr>

        <tr>
            <td>
                <img src="phone.jpg" alt="Smartphone" width="100">
            </td>
            <td>Smartphone</td>
            <td>In Stock</td>
        </tr>

        <tr>
            <td>
                <img src="headphones.jpg" alt="Headphones" width="100">
            </td>
            <td>Wireless Headphones</td>
            <td>₹2,000</td>
            <td>Available</td>
        </tr>
    </table>

</body>
</html>
