<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Location Selection</title>
</head>
<body>

    <h1>Select Your Travel Preferences</h1>

    <!-- Country selection -->
    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>USA</option>
        <option>UK</option>
        <option>Australia</option>
    </select>

    <br><br>

    <!-- State selection -->
    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Delhi</option>
        <option>Maharashtra</option>
        <option>Rajasthan</option>
    </select>

    <br><br>

    <!-- City selection -->
    <label for="city">City:</label>
    <select id="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Lucknow</option>
        <option>Varanasi</option>
    </select>

    <br><br>

    <!-- Tourist place selection -->
    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Vrindavan</option>
        <option>Gateway of India</option>
        <option>India Gate</option>
    </select>

    <!-- Summary -->
    <p>
        You selected India, Uttar Pradesh, Mathura, and Taj Mahal as your
        favorite tourist place.
    </p>

</body>
</html>
