
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Photo Gallery</h1>

    <main class="gallery">

        <figure>
            <img src="https://placehold.co/400x300?text=Mountain" alt="Mountain">
            <figcaption>Beautiful Mountain</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x300?text=Beach" alt="Beach">
            <figcaption>Sunny Beach</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x300?text=Forest" alt="Forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x300?text=City" alt="City">
            <figcaption>Modern City</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x300?text=Lake" alt="Lake">
            <figcaption>Peaceful Lake</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x300?text=Desert" alt="Desert">
            <figcaption>Golden Desert</figcaption>
        </figure>

    </main>

</body>
</html>
