
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>MyWebsite</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">Articles</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="layout">

        <article>
            <h1 class="animated-title">Welcome to My Website</h1>

            <p>This webpage demonstrates the use of CSS Grid
            and Flexbox for responsive layouts.</p>

            <div class="boxes">
                <div class="box">HTML</div>
                <div class="box">CSS</div>
                <div class="box">Responsive Design</div>
            </div>
        </article>

        <aside>
            <h2>Sidebar</h2>
            <p>Latest News</p>
            <p>Recent Articles</p>
            <p>Useful Resources</p>
        </aside>

    </main>

    <footer>
        <p>&copy; 2026 MyWebsite. All Rights Reserved.</p>
    </footer>

</body>
</html>
