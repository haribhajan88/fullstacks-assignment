<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <h1>My Learning Space</h1>
        <nav aria-label="Main navigation">
            <a href="#home">Home</a>
            <a href="#course">Course</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main class="main-content" id="home">
        <section class="content-card" id="course">
            <img
                src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=700&q=80"
                alt="Person working on a laptop">

            <h2>Welcome to Learning Space</h2>

            <p>
                Improve your skills by exploring web development
                and learning modern CSS techniques.
            </p>

            <form action="#" method="get" class="signup-form">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>

                <button type="submit" class="primary-button">
                    Get Started
                </button>

                <button type="reset" class="secondary-button">
                    Reset Form
                </button>
            </form>
        </section>
    </main>

    <footer class="site-footer" id="contact">
        <p>&copy; 2026 My Learning Space. All rights reserved.</p>
    </footer>
</body>
</html>
