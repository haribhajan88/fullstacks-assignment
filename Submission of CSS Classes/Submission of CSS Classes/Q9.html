<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Combined CSS Effects</h1>
        <p>Explore pseudo-classes, transitions, and transformations.</p>
    </header>

    <main class="effects-container">
        <section class="effect-card">
            <h2>Hover Effect</h2>
            <p>Move the pointer over the button.</p>
            <button class="effect-button hover-effect">Hover Me</button>
        </section>

        <section class="effect-card">
            <h2>Active Effect</h2>
            <p>Press and hold the button.</p>
            <button class="effect-button active-effect">Press Me</button>
        </section>

        <section class="effect-card">
            <h2>Focus Effect</h2>
            <p>Use the Tab key to focus the button.</p>
            <button class="effect-button focus-effect">Focus Me</button>
        </section>
    </main>

    <footer>
        <p>Combined Effects — CSS Practical</p>
    </footer>
</body>
</html>
