
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradients</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>CSS Gradient Demo</h2>
    </header>

    <main>
        <section class="linear">
            <h1>Linear Gradient</h1>
            <p>A linear gradient changes colors along a straight line.</p>
        </section>

        <section class="radial">
            <h1>Radial Gradient</h1>
            <p>A radial gradient spreads colors outward from a center.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CSS Practice</p>
    </footer>

</body>
</html>
