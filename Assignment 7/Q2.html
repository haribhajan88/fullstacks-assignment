
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Height and Width Practice</h1>
    </header>

    <main class="container">

        <section class="box box1">
            <h2>Box 1</h2>
            <p>Width: 200px</p>
            <p>Height: 150px</p>
        </section>

        <section class="box box2">
            <h2>Box 2</h2>
            <p>Width: 40%</p>
            <p>Height: 30vh</p>
        </section>

        <section class="box box3">
            <h2>Box 3</h2>
            <p>Width: 15em</p>
            <p>Limited height with overflow</p>
            <p>This extra content demonstrates scrolling.</p>
            <p>More content inside the box.</p>
        </section>

    </main>

</body>
</html>
