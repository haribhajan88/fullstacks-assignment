<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Beautiful Places</h1>
        <p>Explore this responsive image gallery.</p>
    </header>

    <main>
        <section class="gallery">
            <figure class="gallery-item">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=700&q=80"
                         alt="Mountain landscape">
                </div>
                <figcaption>Mountain Escape</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=700&q=80"
                         alt="Lake surrounded by mountains">
                </div>
                <figcaption>Peaceful Lake</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=80"
                         alt="Nature landscape">
                </div>
                <figcaption>Green Nature</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=700&q=80"
                         alt="Ocean waves">
                </div>
                <figcaption>Blue Ocean</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80"
                         alt="Snow-covered mountain peaks">
                </div>
                <figcaption>Snowy Peaks</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=700&q=80"
                         alt="Sunlight shining through a forest">
                </div>
                <figcaption>Deep Forest</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>Image Showcase — CSS Practical</p>
    </footer>
</body>
</html>
