<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CSS Animation Demonstration</h1>
        <p>Three animations created using CSS keyframes.</p>
    </header>

    <main class="animation-container">
        <section class="animation-card">
            <h2>Moving Box</h2>
            <div class="track">
                <div class="moving-box"></div>
            </div>
        </section>

        <section class="animation-card">
            <h2>Bouncing Ball</h2>
            <div class="ball-track">
                <div class="ball"></div>
            </div>
        </section>

        <section class="animation-card">
            <h2>Color-Changing Text</h2>
            <p class="color-text">Amazing CSS!</p>
        </section>
    </main>

    <footer>
        <p>Animations use CSS @keyframes.</p>
    </footer>
</body>
</html>
