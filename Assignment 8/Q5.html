<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Button Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Button Collection</h1>
        <p>Explore different button styles and states.</p>
    </header>

    <main class="button-container">
        <section class="button-card">
            <h2>Primary Button</h2>
            <button class="btn primary">Primary</button>
        </section>

        <section class="button-card">
            <h2>Secondary Button</h2>
            <button class="btn secondary">Secondary</button>
        </section>

        <section class="button-card">
            <h2>Outline Button</h2>
            <button class="btn outline">Outline</button>
        </section>

        <section class="button-card">
            <h2>Disabled Button</h2>
            <button class="btn primary" disabled>Disabled</button>
        </section>
    </main>

    <footer>
        <p>Try hovering, clicking, and focusing on the buttons.</p>
    </footer>
</body>
</html>
